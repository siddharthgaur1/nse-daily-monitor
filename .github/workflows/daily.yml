name: daily-check

on:
  schedule:
    # UTC. NSE publishes the UDiFF bhavcopy in the IST evening; these are 19:30
    # and 22:30 IST. The second is a genuine retry window, not a duplicate:
    # free-tier cron is late or dropped often enough that one fixed time loses
    # days. Verify against actual publication time and tighten if 19:30 is early.
    - cron: "0 14 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to a SHA, not a branch: a refactor in the warehouse should not
      # be able to break this pipeline without a deliberate bump here.
      - run: pip install "nse-warehouse @ git+https://github.com/siddharthgaur1/nse-warehouse@b2b2b6172dbfdf2087d20b2d28d64dd8d6697333"

      # Offline: fixtures are constructed in-process, so a flaky NSE cannot
      # turn a green codebase red here.
      - run: python test_monitor.py

      # Never fails the job itself. The metrics commit has to run even when a
      # check fails, so the job's own verdict is deferred to the last step.
      - id: run
        shell: bash
        run: |
          set +e
          python monitor.py 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "75" ]; then
            echo "::warning::NSE source unavailable -- the ${{ github.event.schedule == '0 14 * * 1-5' && '17:00 UTC' || 'next' }} run retries."
          fi
          exit 0

      - name: Commit metrics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.jsonl
          if git diff --staged --quiet; then
            echo "no new metrics"
            exit 0
          fi
          git commit -m "metrics: $(date -u +%F)"
          # Anything landed since checkout would make a bare push fail, and fail
          # quietly if the exit code went unchecked. set -e makes a conflicting
          # rebase stop the job loudly instead.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Report a failed check
        if: steps.run.outputs.code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create data-quality --color B60205 --description "Failed daily check" --force
          # Listed by label, not by search: the search index lags a minute or
          # more behind a freshly filed issue, so a create-then-search in the
          # same run can miss and file a duplicate anyway.
          existing=$(gh issue list --label data-quality --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file run.log
          else
            gh issue create --title "Data quality check failed" --label data-quality --body-file run.log
          fi

      - name: Fail the job on a failed check
        if: steps.run.outputs.code == '1'
        run: exit 1
